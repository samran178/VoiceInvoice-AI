kind = "web"
previewPath = "/"
title = "VoiceInvoice AI"
version = "1.0.0"
id = "artifacts/voice-invoice"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20329

[services.development]
run = "pnpm --filter @workspace/voice-invoice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voice-invoice", "run", "build" ]
publicDir = "artifacts/voice-invoice/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20329"
BASE_PATH = "/"
